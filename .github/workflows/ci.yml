name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci --prefer-offline --no-audit --no-fund || npm install --prefer-offline --no-audit --no-fund

      - name: Run ESLint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: |
          npm run test -- --run || true
          ret=$?
          echo "Vitest exit code: $ret"
          if [ -f node_modules/.cache/vitest/results.json ]; then cat node_modules/.cache/vitest/results.json; fi
          if [ -f node_modules/.cache/vitest/junit.xml ]; then cat node_modules/.cache/vitest/junit.xml; fi
          exit $ret

      - name: Upload Vitest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-results
          path: ./node_modules/.cache/vitest

  integration-tests:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci --prefer-offline --no-audit --no-fund || npm install --prefer-offline --no-audit --no-fund

      - name: Run integration tests
        # Run only integration tests (these tests mock external services by default)
        run: npm run test -- tests/integration --run

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-integration-results
          path: ./node_modules/.cache/vitest
